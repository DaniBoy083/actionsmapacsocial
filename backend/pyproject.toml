[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint.flake8-bugbear]
# Objetos imutáveis de dependência: padrão explícito do FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/browser_server.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[project]
name = "ac-actions-map-api"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.6",
  "alembic==1.20.1", "psycopg[binary]==3.3.6", "httpx==0.28.1",
  "pydantic-settings==2.16.1", "cryptography==47.0.0"
]

[tool.vercel]
entrypoint = "app.main:app"
